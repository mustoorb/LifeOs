name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Database integration tests ran (not skipped)
        run: npx vitest run apps/server test --reporter=verbose | tee db-tests.txt && ! grep -q "skipped" db-tests.txt
      - run: npm run build -w @lifeos/companion
      - run: npm run build -w @lifeos/server
      - run: npm run build -w @lifeos/web

  companion-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/companion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        working-directory: .
      - name: Build the native helper (universal)
        run: |
          npm run build:helper
          lipo -info build/bin/lifeos-frontmost
      - name: Helper prints the frontmost app as JSON
        run: |
          ./build/bin/lifeos-frontmost > helper.out &
          pid=$!
          sleep 3
          kill "$pid"
          head -n 1 helper.out
          head -n 1 helper.out | python3 -c 'import json, sys; d = json.loads(sys.stdin.readline()); assert set(d) == {"bundleId", "name"}, d'
      - run: npm run build
      - name: The Mac hosting script runs on the bash and plutil that ship with macOS
        run: |
          /bin/bash -n deploy/mac.sh
          /bin/bash -n deploy/lifeos
          printf '{"BackendState":"Running","Self":{"DNSName":"mac.tail1.ts.net."}}' | plutil -extract Self.DNSName raw -o - - | grep -qx 'mac.tail1.ts.net.'
          /bin/bash -c "$(sed -n '/^urlencode()/,/^}/p' deploy/mac.sh); [[ \$(urlencode 'me+x@gmail.com') == me%2Bx%40gmail.com ]]"
      - name: Package an unsigned app bundle
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --dir --publish never
      - name: Inspect the bundle
        run: |
          app=$(ls -d release/mac*/"LifeOS Companion.app")
          test "$(plutil -extract LSUIElement raw "$app/Contents/Info.plist")" = "true"
          test -x "$app/Contents/Resources/bin/lifeos-frontmost"
          codesign -d --entitlements - "$app" || true

  docker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t lifeos .
      - name: Boot it in production mode against a local SMTP sink
        run: |
          docker run -d --name smtp -p 1025:1025 -p 8025:8025 axllent/mailpit
          docker run -d --name lifeos --network host \
            -e NODE_ENV=production \
            -e PORT=8787 \
            -e DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/postgres \
            -e LIFEOS_SECRET=ci-secret-ci-secret-ci-secret-ci-secret \
            -e SMTP_URL=smtp://127.0.0.1:1025 \
            -e MAIL_FROM='LifeOS <hello@lifeos.test>' \
            lifeos
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8787/v1/health && break; sleep 1; done
          docker logs lifeos
      - name: Serves the API, the web client, and sends sign-in mail
        run: |
          curl -fs http://127.0.0.1:8787/v1/health
          curl -fs -D - -o /dev/null http://127.0.0.1:8787/ | grep -i "content-security-policy: default-src 'none'"
          curl -fs -X POST -H 'content-type: application/json' -d '{"email":"ci@example.com"}' http://127.0.0.1:8787/v1/auth/start
          sleep 2
          curl -fs http://127.0.0.1:8025/api/v1/messages | grep -q "Your LifeOS sign-in code"
          docker exec lifeos node apps/server/dist/cli.js issue-codes --campaign founding --count 1

  self-hosted-stack:
    # The stack deploy/setup.sh installs: compose + Caddy HTTPS, driven through the lifeos command.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint the deploy scripts
        run: shellcheck -x deploy/setup.sh deploy/mac.sh deploy/lifeos
      - name: Start the stack with a local SMTP sink
        run: |
          cat > deploy-ci.yml <<'YML'
          services:
            mailpit:
              image: axllent/mailpit
              ports: ['127.0.0.1:8025:8025']
          YML
          cat > .env <<'ENV'
          COMPOSE_FILE=docker-compose.yml:deploy/compose.https.yml:deploy-ci.yml
          LIFEOS_DOMAIN=localhost
          POSTGRES_PASSWORD=ci-database-password
          LIFEOS_SECRET=ci-secret-ci-secret-ci-secret-ci-secret
          SMTP_URL='smtp://mailpit:1025'
          MAIL_FROM='LifeOS <hello@lifeos.test>'
          ENV
          docker compose up -d --build --quiet-pull
          for i in $(seq 1 60); do curl -fs https://localhost/v1/health -k && break; sleep 2; done
          docker compose ps
      - name: Serves over HTTPS through Caddy and sends sign-in mail
        run: |
          curl -fsk https://localhost/v1/health
          curl -fsk -D - -o /dev/null https://localhost/ | grep -i "content-security-policy: default-src 'none'"
          curl -fs -o /dev/null -w '%{http_code}' http://localhost/ | grep -q 308
          curl -fsk -X POST -H 'content-type: application/json' -d '{"email":"ci@example.com"}' https://localhost/v1/auth/start
          sleep 2
          curl -fs http://127.0.0.1:8025/api/v1/messages | grep -q "Your LifeOS sign-in code"
      - name: The lifeos command works
        env:
          LIFEOS_DIR: ${{ github.workspace }}
          LIFEOS_BACKUP_DIR: ${{ runner.temp }}/backups
        run: |
          sudo -E bash deploy/lifeos status
          sudo -E bash deploy/lifeos admin create-season --id founding-1 --name "Founding Season" --starts 2026-11-02 --weeks 6 --campaigns founding
          sudo -E bash deploy/lifeos admin issue-codes --campaign founding --count 2 --expires-days 30
          sudo -E bash deploy/lifeos backup
          sudo -E sh -c 'zcat "$LIFEOS_BACKUP_DIR"/*.sql.gz' | grep -q "CREATE TABLE public.seasons"
      - if: failure()
        run: docker compose logs
