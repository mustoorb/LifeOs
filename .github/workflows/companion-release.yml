name: Companion release

# Builds the macOS companion for your LifeOS server and attaches the .dmg files
# to the run. Start it from the Actions tab ("Run workflow").
#
# Signing and notarization happen only when these repository secrets exist:
#   CSC_LINK, CSC_KEY_PASSWORD       Developer ID Application certificate (.p12, base64) and its password
#   APPLE_API_KEY                    App Store Connect API key (.p8 contents)
#   APPLE_API_KEY_ID, APPLE_API_ISSUER
# Without them the build is unsigned: testers right-click → Open the first time.

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Your LifeOS server, e.g. https://lifeos.example.com'
        required: true

jobs:
  build:
    runs-on: macos-latest
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    defaults:
      run:
        working-directory: apps/companion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        working-directory: .
      - name: Check the server address
        env:
          SERVER_URL: ${{ inputs.server_url }}
        run: |
          case "$SERVER_URL" in https://*) ;; *) echo "server_url must start with https://"; exit 1;; esac
          curl -fsS "$SERVER_URL/v1/health"
      - run: npm run build:helper
      - name: Build for the server
        env:
          LIFEOS_SERVER_URL: ${{ inputs.server_url }}
        run: npm run build
      - name: Package (signed and notarized)
        if: env.CSC_LINK != '' && env.APPLE_API_KEY_CONTENT != ''
        run: |
          echo "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"
          APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8" npx electron-builder --mac --publish never -c.mac.notarize=true
      - name: Package (unsigned)
        if: env.CSC_LINK == '' || env.APPLE_API_KEY_CONTENT == ''
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: lifeos-companion
          path: apps/companion/release/*.dmg
          if-no-files-found: error
