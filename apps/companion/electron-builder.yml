appId: app.lifeos.companion
productName: LifeOS Companion
copyright: Copyright © 2026 LifeOS
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - package.json
extraResources:
  - from: build/bin/lifeos-frontmost
    to: bin/lifeos-frontmost
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  minimumSystemVersion: '12.0'
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    # Menu-bar app: no Dock icon.
    LSUIElement: true
dmg:
  title: LifeOS Companion
