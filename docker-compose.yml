# Self-hosted LifeOS: PostgreSQL + the server (which also serves the web client).
#   cp .env.example .env   # then fill it in
#   docker compose up -d --build
# Put an HTTPS reverse proxy (Caddy, nginx, your host's load balancer) in front of port 8787.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: lifeos
      POSTGRES_USER: lifeos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lifeos']
      interval: 5s
      retries: 10

  server:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://lifeos:${POSTGRES_PASSWORD}@db:5432/lifeos
      LIFEOS_SECRET: ${LIFEOS_SECRET:?set LIFEOS_SECRET in .env}
      SMTP_URL: ${SMTP_URL:?set SMTP_URL in .env}
      MAIL_FROM: ${MAIL_FROM:?set MAIL_FROM in .env}
      LIFEOS_TRUST_PROXY: '1'
    ports:
      - '127.0.0.1:8787:8787'

volumes:
  db-data:
